---
name: Build disk images

on:
  workflow_dispatch:
    inputs:
      upload-to-s3:
        description: "Upload to S3"
        required: false
        default: false
        type: boolean
      platform:
        required: true
        type: choice
        options:
          - amd64
          - arm64
  pull_request:
    branches:
      - main
    paths:
      - './disk_config/disk.toml'
      - './disk_config/iso-*.toml'
      - './.github/workflows/build-disk.yml'

env:
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"  # do not edit
  DEFAULT_TAG: "latest"
  BIB_IMAGE: "quay.io/centos-bootc/bootc-image-builder:latest"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    name: Build disk images
    # ubuntu-26.04 runners refuse the mounts osbuild needs (permission denied)
    runs-on: ${{ inputs.platform == 'amd64' && 'ubuntu-24.04' || 'ubuntu-24.04-arm' }}
    strategy:
      fail-fast: false
      matrix:
        # qcow2 fails on the hosted runner (osbuild cannot mount container
        # storage); VM disks are built locally with `just build-qcow2`.
        disk-type: ["anaconda-iso"]
        image_name: ["rimfrost-os", "rimfrost-os-nvidia"]
    permissions:
      contents: read
      packages: read
      id-token: write

    steps:
      - name: Prepare environment
        run: |
          USER_UID=$(id -u)
          USER_GID=$(id -g)
          # Concatenate the types with a hyphen
          DISK_TYPE=$(echo "${{ matrix.disk-type }}" | tr ' ' '-')
          # Lowercase the image uri
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> ${GITHUB_ENV}
          echo "IMAGE_NAME=${{ matrix.image_name }}" >> ${GITHUB_ENV}
          echo "DISK_TYPE=${DISK_TYPE}" >> ${GITHUB_ENV}
          echo "USER_UID=${USER_UID}" >> ${GITHUB_ENV}
          echo "USER_GID=${USER_GID}" >> ${GITHUB_ENV}

      - name: Install dependencies
        if: inputs.platform == 'arm64'
        run: |
          set -x
          sudo apt update -y
          sudo apt install -y \
            podman

      - name: Maximize build space
        if: inputs.platform != 'arm64'
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6
        with:
          remove-codeql: true

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build disk images
        id: build
        uses: osbuild/bootc-image-builder-action@8661cd3832544ad68c12dcde8681b13ab0f56a8d # main
        with:
          builder-image: ${{ env.BIB_IMAGE }}
          config-file: ${{ matrix.disk-type == 'anaconda-iso' && format('./disk_config/iso-{0}.toml', matrix.image_name) || './disk_config/disk.toml' }}
          image: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.DEFAULT_TAG }}
          chown: ${{ env.USER_UID }}:${{ env.USER_GID }}
          types: ${{ matrix.disk-type }}
          additional-args: --use-librepo=True --rootfs=btrfs

      - name: Upload disk images and Checksum to Job Artifacts
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.image_name }}-${{ matrix.disk-type }}
          path: ${{ steps.build.outputs.output-directory }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          overwrite: true

      # The public download: the newest ISO of each variant under a fixed name
      # in the R2 bucket, with its SHA256 next to it.
      - name: Upload to R2
        if: github.event_name != 'pull_request' && env.HAS_R2 == 'true'
        shell: bash
        env:
          HAS_R2: ${{ secrets.S3_SECRET_ACCESS_KEY != '' }}
          RCLONE_CONFIG_S3_TYPE: s3
          RCLONE_CONFIG_S3_PROVIDER: ${{ secrets.S3_PROVIDER }}
          RCLONE_CONFIG_S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          RCLONE_CONFIG_S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_S3_REGION: ${{ secrets.S3_REGION }}
          RCLONE_CONFIG_S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          RCLONE_CONFIG_S3_NO_CHECK_BUCKET: "true"
          SOURCE_DIR: ${{ steps.build.outputs.output-directory }}
          BUCKET: ${{ secrets.S3_BUCKET_NAME }}
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -y -q rclone
          iso=$(find "$SOURCE_DIR" -name '*.iso' | head -1)
          name="${{ matrix.image_name }}.iso"
          sha256sum "$iso" | awk -v n="$name" '{print $1 "  " n}' > "$name.sha256"
          rclone copyto --s3-upload-concurrency 8 "$iso" "S3:$BUCKET/$name"
          rclone copyto "$name.sha256" "S3:$BUCKET/$name.sha256"
          echo "Uploaded $name ($(stat -c %s "$iso") bytes)"
