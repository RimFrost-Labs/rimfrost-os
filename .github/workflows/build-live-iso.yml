---
# Demo ISOs: boot RimFrost OS from a USB stick to try it (the live session
# is the demo) and install it from there (Anaconda). Built like Bazzite's live ISOs (installer/ is adapted from
# Bazzite, see installer/NOTICE) with titanoboa, signed with our cosign key and
# uploaded to R2 as <image>-demo.iso.
name: Build demo ISOs

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build-live-iso:
    name: Demo ISO (${{ matrix.image_name }})
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        image_name: ["rimfrost-os", "rimfrost-os-nvidia"]
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6 # v2.0.0
        with:
          tool-cache: true

      - name: Container storage on a btrfs loopback
        run: |
          sudo truncate -s 110G /mnt/podman-storage.img
          sudo mkfs.btrfs -f -m single -d single /mnt/podman-storage.img
          sudo podman system reset --force
          sudo systemctl stop podman.service
          LOOP=$(sudo losetup --find --show --direct-io=on /mnt/podman-storage.img)
          sudo mkdir -p /mnt/podman-storage
          sudo mount -o compress-force=zstd:2,discard=async,noatime "$LOOP" /mnt/podman-storage
          sudo mkdir -p /mnt/podman-storage/storage /mnt/podman-storage/tmp
          sudo mount --bind /mnt/podman-storage/storage /var/lib/containers/storage
          sudo systemctl start podman.service

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The live session runs the AMD/Intel image (open drivers work on every
      # card); the image it installs is the matrix variant.
      - name: Build the live payload image
        run: |
          sudo env TMPDIR=/mnt/podman-storage/tmp podman build \
            --cap-add sys_admin \
            --security-opt label=disable \
            --build-arg BASE_IMAGE=ghcr.io/rimfrost-labs/rimfrost-os:latest \
            --build-arg INSTALL_IMAGE_PAYLOAD=ghcr.io/rimfrost-labs/${{ matrix.image_name }}:latest \
            --build-arg FLATPAK_DIR_SHORTNAME=kde_flatpaks \
            -t localhost/payload:latest installer/

      - name: Build the ISO
        id: build
        uses: Zeglius/titanoboa@7737f4748458252ac827dca14b3d6dd09298472a # revamp-pr, as used by Bazzite
        with:
          image-ref: localhost/payload:latest
          iso-dest: ${{ github.workspace }}/${{ matrix.image_name }}-demo.iso

      - name: Checksum
        id: sums
        run: |
          iso="${{ steps.build.outputs.iso-dest }}"
          name="${{ matrix.image_name }}-demo.iso"
          # titanoboa may leave the file in its own action directory
          [ "$(realpath "$iso")" = "$(realpath -m "$name")" ] || mv "$iso" "$name"
          sha256sum "$name" | tee "$name.sha256"
          ls -la "$name"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v3.1.2'

      - name: Sign the ISO
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_SECRET }}
        run: |
          cosign sign-blob -y --new-bundle-format=false --use-signing-config=false \
            --key env://SIGNING_KEY "${{ matrix.image_name }}-demo.iso" \
            --output-signature "${{ matrix.image_name }}-demo.iso.sig"

      - name: Upload to R2
        env:
          RCLONE_CONFIG_S3_TYPE: s3
          RCLONE_CONFIG_S3_PROVIDER: ${{ secrets.S3_PROVIDER }}
          RCLONE_CONFIG_S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          RCLONE_CONFIG_S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_S3_REGION: ${{ secrets.S3_REGION }}
          RCLONE_CONFIG_S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          RCLONE_CONFIG_S3_NO_CHECK_BUCKET: "true"
          BUCKET: ${{ secrets.S3_BUCKET_NAME }}
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -y -q rclone
          n="${{ matrix.image_name }}-demo.iso"
          rclone copyto --s3-upload-concurrency 8 "$n" "S3:$BUCKET/$n"
          rclone copyto "$n.sha256" "S3:$BUCKET/$n.sha256"
          rclone copyto "$n.sig" "S3:$BUCKET/$n.sig"
