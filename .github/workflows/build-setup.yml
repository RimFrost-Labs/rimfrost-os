---
# RimFrost Setup (setup/): the Windows app that installs RimFrost OS without a
# USB stick. Built on Windows (WPF, .NET Framework 4.8), tested
# (setup-tests/), and uploaded to R2 as RimFrostSetup.exe.
# Not code-signed yet: Windows shows "Unknown publisher" (planned for v1).
name: Build Setup

on:
  push:
    branches: [main]
    paths:
      - 'setup/**'
      - 'setup-tests/**'
      - 'cosign.pub'
      - '.github/workflows/build-setup.yml'
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Tests
        run: dotnet run -c Release --project setup-tests/SetupTests.csproj

      - name: Build
        run: dotnet build -c Release setup/RimFrostSetup.csproj

      - name: Checksum
        shell: pwsh
        run: |
          Copy-Item setup/bin/Release/net48/RimFrostSetup.exe RimFrostSetup.exe
          $h = (Get-FileHash RimFrostSetup.exe -Algorithm SHA256).Hash.ToLower()
          "$h  RimFrostSetup.exe" | Set-Content -NoNewline -Encoding ascii RimFrostSetup.exe.sha256
          Get-Content RimFrostSetup.exe.sha256

      - uses: actions/upload-artifact@v7
        with:
          name: RimFrostSetup
          path: |
            RimFrostSetup.exe
            RimFrostSetup.exe.sha256

  upload:
    name: Upload to R2
    needs: build
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: RimFrostSetup

      - name: Upload
        env:
          RCLONE_CONFIG_S3_TYPE: s3
          RCLONE_CONFIG_S3_PROVIDER: ${{ secrets.S3_PROVIDER }}
          RCLONE_CONFIG_S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          RCLONE_CONFIG_S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_S3_REGION: ${{ secrets.S3_REGION }}
          RCLONE_CONFIG_S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          RCLONE_CONFIG_S3_NO_CHECK_BUCKET: "true"
          BUCKET: ${{ secrets.S3_BUCKET_NAME }}
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -y -q rclone
          rclone copyto RimFrostSetup.exe "S3:$BUCKET/RimFrostSetup.exe"
          rclone copyto RimFrostSetup.exe.sha256 "S3:$BUCKET/RimFrostSetup.exe.sha256"
