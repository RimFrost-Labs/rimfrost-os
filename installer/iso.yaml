label: "RimFrost-Live"
grub2:
  timeout: 5
  entries:
    - name: "Try or install RimFrost OS"
      linux: "/images/pxeboot/vmlinuz quiet rhgb root=live:CDLABEL=RimFrost-Live enforcing=0 rd.live.image"
      initrd: "/images/pxeboot/initrd.img"
    - name: "Try or install RimFrost OS (basic graphics)"
      linux: "/images/pxeboot/vmlinuz quiet rhgb root=live:CDLABEL=RimFrost-Live enforcing=0 rd.live.image nomodeset"
      initrd: "/images/pxeboot/initrd.img"
